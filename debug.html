<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erzähl uns von dir</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f2a28;
    color: #f4ede0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  #debugBox {
    position: fixed; top: 0; left: 0; right: 0;
    background: #ffdddd; color: #900; font-family: monospace;
    font-size: 13px; padding: 10px; z-index: 9999;
    white-space: pre-wrap; word-break: break-word;
    display: none;
  }
  .card { position: relative; z-index: 1; max-width: 460px; width: 100%; }
  .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #c98a4b; margin-bottom: 14px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 40px; line-height: 1.2; margin: 0 0 18px; }
  .lead { color: rgba(244,237,224,0.7); font-size: 16px; line-height: 1.6; margin-bottom: 36px; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: #c98a4b; color: #0f2a28; border: none;
    font-weight: 600; font-size: 15px; padding: 14px 26px;
    border-radius: 999px; cursor: pointer;
  }
  .center { text-align: center; }
</style>
</head>
<body>

<div id="debugBox"></div>

<div class="card">
  <div id="viewIntro" class="center">
    <p class="eyebrow">Test-Version</p>
    <h1>Debug-Check</h1>
    <p class="lead" id="statusText">JavaScript lädt...</p>
    <button class="btn-primary" onclick="testClick()">Test-Button</button>
  </div>
</div>

<script>
  // Globaler Fehler-Fänger - zeigt JEDEN Fehler sichtbar auf der Seite
  window.onerror = function(msg, url, line, col, error) {
    const box = document.getElementById('debugBox');
    box.style.display = 'block';
    box.textContent = 'FEHLER: ' + msg + '\nZeile: ' + line + ', Spalte: ' + col;
    return false;
  };

  document.getElementById('statusText').textContent = 'JavaScript läuft! ✓';

  function testClick() {
    document.getElementById('statusText').textContent = 'Button funktioniert! ✓✓✓';
  }

  // Testet ob Supabase-Bibliothek geladen wurde
  try {
    if (typeof window.supabase === 'undefined') {
      throw new Error('Supabase-Bibliothek wurde NICHT geladen (window.supabase ist undefined)');
    } else {
      document.getElementById('statusText').textContent += ' | Supabase-Bibliothek geladen ✓';
    }
  } catch (e) {
    const box = document.getElementById('debugBox');
    box.style.display = 'block';
    box.textContent = 'FEHLER: ' + e.message;
  }
</script>

</body>
</html>
