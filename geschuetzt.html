<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geschützter Bereich</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1e293b, #334155);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    color: #1e293b;
  }
  p.sub {
    margin: 0 0 28px;
    color: #64748b;
    font-size: 14px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
  }
  input:focus {
    outline: none;
    border-color: #6366f1;
  }
  button {
    width: 100%;
    padding: 13px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: #4f46e5;
  }
  .error {
    color: #dc2626;
    font-size: 13px;
    margin: -8px 0 16px;
    display: none;
  }
  .hint {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 16px;
    text-align: center;
  }

  /* Ergebnisanzeige */
  .result-item {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #e2e8f0;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item .label { color: #64748b; font-size: 14px; }
  .result-item .value { color: #1e293b; font-weight: 600; font-size: 14px; }
  .success-icon {
    width: 48px;
    height: 48px;
    background: #dcfce7;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 24px;
  }
</style>
</head>
<body>

<div class="card" id="loginCard">
  <h1>🔒 Geschützter Bereich</h1>
  <p class="sub">Bitte gib das Passwort ein, um deine Daten zu sehen.</p>

  <form id="loginForm">
    <label for="password">Passwort</label>
    <input type="password" id="password" required placeholder="Passwort eingeben">
    <p class="error" id="errorMsg">Falsches Passwort. Bitte versuche es erneut.</p>

    <button type="submit">Entsperren</button>
  </form>

  <p class="hint">Demo-Passwort: <strong>1234</strong></p>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div class="success-icon">✓</div>
  <h1 style="text-align:center;">Zugriff gewährt</h1>
  <p class="sub" style="text-align:center;">Hier sind deine übermittelten Daten:</p>

  <div id="resultList"></div>
</div>

<script>
  const CORRECT_PASSWORD = "1234"; // Nur für Demo-Zwecke, keine echte Sicherheit!

  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || '–';
  const age = params.get('age') || '–';
  const hobby = params.get('hobby') || '–';

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const entered = document.getElementById('password').value;

    if (entered === CORRECT_PASSWORD) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';

      document.getElementById('resultList').innerHTML = `
        <div class="result-item"><span class="label">Name</span><span class="value">${escapeHtml(name)}</span></div>
        <div class="result-item"><span class="label">Alter</span><span class="value">${escapeHtml(age)}</span></div>
        <div class="result-item"><span class="label">Hobby</span><span class="value">${escapeHtml(hobby)}</span></div>
      `;
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  });

  // Kleine Sicherheitsmaßnahme gegen HTML-Injection in der Anzeige
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
