<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deine Angaben</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1e293b, #334155);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    color: #1e293b;
  }
  p.sub {
    margin: 0 0 28px;
    color: #64748b;
    font-size: 14px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 20px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    transition: border-color 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #6366f1;
  }
  button {
    width: 100%;
    padding: 13px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: #4f46e5;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Deine Angaben</h1>
  <p class="sub">Fülle das Formular aus, um fortzufahren.</p>

  <form id="dataForm">
    <label for="name">Name</label>
    <input type="text" id="name" required placeholder="z. B. Max">

    <label for="age">Alter</label>
    <input type="number" id="age" required placeholder="z. B. 25" min="0" max="120">

    <label for="hobby">Hobby</label>
    <input type="text" id="hobby" required placeholder="z. B. Fußball">

    <button type="submit">Weiter →</button>
  </form>
</div>

<script>
  document.getElementById('dataForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const age = document.getElementById('age').value.trim();
    const hobby = document.getElementById('hobby').value.trim();

    // Daten als URL-Parameter an die zweite Seite übergeben
    const params = new URLSearchParams({ name, age, hobby });
    window.location.href = 'geschuetzt.html?' + params.toString();
  });
</script>

</body>
</html>
